[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Self-hosted web fonts (app/fonts.css). Each file name carries the Google
# Fonts version (inter-v20-*, space-grotesk-v22-*), so a new font version
# gets a new name and the old file can be cached for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
